<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Task Manager</h1>
        <p>Organize your studies, achieve your goals!</p>
    </header><main class="container">
    <section class="task-form">
        <h2>Add a New Task</h2>
        <input type="text" id="taskTitle" placeholder="Enter task name">
        <input type="date" id="taskDate">
        <button onclick="addTask()">Add Task</button>
    </section>

    <section class="task-list">
        <h2>My Tasks</h2>
        <ul id="tasks">
            <li class="empty-message">No tasks yet. Add your first task!</li>
        </ul>
    </section>
</main>

<footer>
    <p>SWYNEX Student Task Manager | Project Architecture</p>
</footer>

<script src="script.js"></script>

</body>
</html>
